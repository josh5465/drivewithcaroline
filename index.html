<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive with Caroline</title>
<meta name="description" content="Driving lessons with Caroline. Site coming soon.">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    text-align:center;
    padding:2rem;
    background:#23262B;
    color:#fff;
    font-family:system-ui, -apple-system, sans-serif;
    line-height:1.6;
  }
  .plate{
    width:110px;
    height:110px;
    background:#fff;
    border-radius:8px;
    display:grid;
    place-items:center;
    margin:0 auto 2rem;
  }
  .plate span{
    font-size:5rem;
    font-weight:800;
    color:#C8102E;
    line-height:1;
  }
  h1{
    font-size:clamp(2rem,7vw,3rem);
    margin:0 0 1rem;
    letter-spacing:-.02em;
  }
  p{
    margin:0 0 2rem;
    color:#C9CCD2;
  }
  a{
    color:#fff;
    font-weight:600;
    text-decoration:none;
    background:#C8102E;
    padding:.85rem 1.75rem;
    border-radius:999px;
    display:inline-block;
  }
  a:hover{background:#A80D26;}
</style>
</head>
<body>
  <main>
    <div class="plate" aria-hidden="true"><span>L</span></div>
    <h1>Drive with Caroline</h1>
    <p>Driving lessons. Site coming soon.</p>
    <a href="tel:+440000000000">0000 000 0000</a>
  </main>
</body>
</html>
